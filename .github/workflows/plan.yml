# =============================================================================
# Terraform Plan — Pull Request Workflow
# =============================================================================
# Runs on every Pull Request to preview infrastructure changes BEFORE merging.
# Includes:
# - terraform plan (what will change?)
# - tfsec security scan (any misconfigurations?)
# - Infracost cost estimate (how much will this cost the client?)
#
# This is the "shift left" approach — catch problems before production.
# In a consulting context, this gives PE clients confidence that every
# change is reviewed for security AND cost impact.
# =============================================================================

name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  plan:
    name: "Plan & Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # OIDC authentication — no static AWS credentials stored
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      # Post the plan output as a PR comment for review
      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }} on \`${{ github.event.pull_request.head.ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Security scan — catches misconfigurations like unencrypted buckets
      - name: Run tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  # Cost estimation — shows the PE client exactly what they'll spend
  cost:
    name: "Cost Estimate"
    runs-on: ubuntu-latest
    if: ${{ secrets.INFRACOST_API_KEY != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Cost Estimate
        run: |
          infracost breakdown \
            --path=terraform \
            --format=json \
            --out-file=/tmp/infracost.json

      - name: Post Cost Estimate to PR
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo=${{ github.repository }} \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --behavior=update
